[package]
name = "leongit"
version = "0.1.0"
description = "A fast, offline-first Git desktop client"
authors = ["LeonGit"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "leongit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
